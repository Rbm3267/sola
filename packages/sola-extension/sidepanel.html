<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sola Component Dock</title>
  <style>
    body {
      background: #090d19;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      font-size: 13px;
    }
    h2 { font-size: 14px; margin-bottom: 8px; color: #fff; }
    p { font-size: 11px; color: #94a3b8; margin-bottom: 16px; line-height: 1.4; }
    .dock-btn {
      width: 100%;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .dock-btn:hover {
      background: #334155;
      border-color: #10b981;
    }
    .pill {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-family: monospace;
    }
    .install-box {
      margin-top: 20px;
      padding: 12px;
      background: #030712;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }
    code { font-family: monospace; color: #38bdf8; font-size: 11px; }
  </style>
</head>
<body>
  <h2>Sola Component Dock</h2>
  <p>Preview and trigger live Sola ambient components on the active browser tab.</p>

  <button class="dock-btn" id="btn-datacard">
    <span>DataCard (MRR Metric)</span>
    <span class="pill">⚡ Test</span>
  </button>
  <button class="dock-btn" id="btn-waterfall">
    <span>FlowWaterfall (ARR)</span>
    <span class="pill">⚡ Test</span>
  </button>
  <button class="dock-btn" id="btn-dial">
    <span>TactileDial (Capacity)</span>
    <span class="pill">⚡ Test</span>
  </button>

  <div class="install-box">
    <div style="font-weight: 700; font-size: 11px; color: #94a3b8; margin-bottom: 6px;">PRODUCTION INSTALL</div>
    <code>npm install @sola/core @sola/ui</code>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
